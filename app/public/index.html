          localStorage.setItem('zd:owner', '1');
          document.cookie = 'zd_owner=1; max-age=31536000; path=/; SameSite=Lax';
          ownerUrl.searchParams.delete('owner');
          history.replaceState(null, '', ownerUrl.pathname + ownerUrl.search + ownerUrl.hash);
        }
      } catch (e) {

    </script>
